<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUMAÚMA — Painel Super Admin</title>
  <link rel="icon" type="image/png" href="/icons/ico-branco.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="/config.js"></script>
</head>

<body>

  <!-- LOADING -->
  <div id="loading">
    <div class="spinner-lg"></div>
    <p style="color:var(--text-dim);font-size:14px;">A verificar autenticação…</p>
  </div>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <img src="/icons/ico-branco.png" alt="SUMAÚMA" />
      <h1>SUMAÚMA</h1>
      <p>Painel Super Admin — acesso restrito</p>
      <div class="login-error" id="login-error"></div>
      <div class="field"><label>E-mail</label><input type="email" id="in-email" placeholder="admin@sumauma.com" /></div>
      <div class="field"><label>Senha</label><input type="password" id="in-pass" placeholder="••••••••" /></div>
      <button class="btn-primary-login" id="btn-login" onclick="doLogin()">Entrar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen">
    <header>
      <div class="header-left">
        <img src="/icons/ico-branco.png" alt="" />
        <span>SUMAÚMA</span>
        <span class="badge">Super Admin</span>
      </div>
      <div class="header-right">
        <span class="user-email" id="header-email"></span>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Sair</button>
      </div>
    </header>

    <main>
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('tab-requests')">Solicitações</button>
        <button class="tab-btn" onclick="switchTab('tab-users')">Usuários</button>
        <button class="tab-btn" onclick="switchTab('tab-plants')">Plantas</button>
      </div>

      <!-- TAB: REQUESTS -->
      <div id="tab-requests" class="tab-content active">
        <h2 style="margin-bottom:16px;">Pedidos de Acesso</h2>
        <div id="requests-list"></div>
        <div id="empty-state-requests" style="display:none">Nenhum pedido pendente.</div>
      </div>

      <!-- TAB: USERS -->
      <div id="tab-users" class="tab-content">
        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Pesquisar usuários…" oninput="renderUsersTable()" />
          </div>
          <button class="btn btn-green" onclick="openCreateModal()">＋ Criar Usuário</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Email</th><th>Nome</th><th>Cargo</th><th>Ações</th></tr></thead>
            <tbody id="users-tbody"></tbody>
          </table>
          <div id="empty-state-users" style="display:none">Nenhum utilizador encontrado.</div>
        </div>
      </div>

      <!-- TAB: PLANTS -->
      <div id="tab-plants" class="tab-content">
        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-plants" placeholder="Pesquisar plantas…" oninput="renderPlantsTable()" />
          </div>
          <button class="btn btn-green" onclick="openPlantForm()">＋ Nova Planta</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nome</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="plants-tbody"></tbody>
          </table>
          <div id="empty-state-plants" style="display:none">Nenhuma planta encontrada.</div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL: Atribuir Cargo -->
  <div class="modal-backdrop" id="modal-role">
    <div class="modal">
      <h2 id="modal-title">🎖️ Atribuir Cargo</h2>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:18px;" id="modal-role-email"></p>
      <div class="field">
        <label>Cargo</label>
        <select id="role-select">
          <option value="usuario">Usuário (leitor)</option>
          <option value="escritor">Escritor (editar plantas)</option>
          <option value="admin">Admin (gerenciar apps)</option>
          <option value="super_admin">Super Admin (total)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeRoleModal()">Cancelar</button>
        <button class="btn btn-green" id="btn-save-role" onclick="saveRole()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Criar Conta -->
  <div class="modal-backdrop" id="modal-create">
    <div class="modal">
      <h2>✨ Criar Conta</h2>
      <div class="field"><label>Nome</label><input type="text" id="new-name" placeholder="Nome completo" /></div>
      <div class="field"><label>E-mail</label><input type="email" id="new-email" /></div>
      <div class="field"><label>Senha</label><input type="password" id="new-pass" placeholder="Mínimo 6 chars" /></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeCreateModal()">Cancelar</button>
        <button class="btn btn-green" id="btn-create" onclick="doCreateUser()">Criar</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="app.js"></script>

</body>
</html>
