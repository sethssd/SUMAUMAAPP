name: baderna_apk
description: "SUMAÚMA — Enciclopédia de Plantas da Amazônia"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  model_viewer_plus: ^1.9.3
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  file_picker: ^10.3.6
  cloudinary_public: ^0.23.1
  flutter_widget_from_html: ^0.17.1
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  just_audio_background: ^0.0.1-beta.17
  flutter_svg: ^2.2.4
  sign_in_with_apple: ^6.1.2
  flutter_facebook_auth: ^7.1.1
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icons/icon.png"

flutter:
  uses-material-design: true

  assets:
  - assets/models/
  - assets/icons/alertas/
  - assets/icons/conta/
  - assets/icons/ficha/
  - assets/icons/medicinais/
  - assets/icons/navegacao/
  - icons/
